<!DOCTYPE html>
<html>

<head>
    <title>Noah Site</title>

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #f8f6f0;
            color: #111;
            margin: 0;
        }

        nav {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #999;
        }

        nav a {
            text-decoration: none;
            margin-right: 18px;
            color: #111;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            max-width: 1000px;
            margin: 0 auto;
            padding: 70px 30px 45px;
            border-bottom: 1px solid #999;
        }

        .hero h1 {
            font-size: 52px;
            margin: 0 0 10px;
            font-weight: normal;
        }

        .hero p {
            font-size: 20px;
            margin: 0;
            color: #555;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px;

            columns: 2;
            column-gap: 20px;
        }

        .meme {
            background: white;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #999;

            break-inside: avoid;
        }

        .meme p {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: bold;
        }

        img {
            width: 100%;
            display: block;
        }

        @media (max-width: 700px) {
            .container {
                columns: 1;
            }

            .hero h1 {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="cities.html">Cities</a>
        <a href="profile.html">Profile</a>
    </nav>

    <div class="hero">
        <h1>Welcome to Noah's Site</h1>
    </div>

    <div class="container">

        <div class="meme">
            <p>Lmao look at this</p>
            <img src="images/kansas-kid-essay.png" alt="Bro threw away his shot at Harvard">
        </div>

        <div class="meme">
            <p>The slogan of the world</p>
            <img src="images/keep-calm-and-noah-is-cool.png" alt="Keep calm and Noah is cool">
        </div>

    </div>

</body>
</html>
